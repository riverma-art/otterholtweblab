<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Otter Holt BudgetLab</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel standalone for in-browser JSX compiling -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // Firebase Configuration Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyDXGhAf7N3_dDqsp86oxhzw4q4fbcImuHU",
      authDomain: "otter-holt-budgetlab.firebaseapp.com",
      databaseURL: "https://otter-holt-budgetlab-default-rtdb.firebaseio.com",
      projectId: "otter-holt-budgetlab",
      storageBucket: "otter-holt-budgetlab.firebasestorage.app",
      messagingSenderId: "990149583631",
      appId: "1:990149583631:web:31d5dde8894c8255c8547a",
      measurementId: "G-EH2JKTP571"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const { useState, useEffect } = React;

    // SVG Icons
    const CalendarIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    );

    const PlusCircle = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="6" y1="12" x2="18" y2="12"></line>
      </svg>
    );

    const DollarSign = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    );

    const User = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    );

    const Users = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path d="M17 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M9 21v-2a4 4 0 0 0-4-4H3a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const CheckCircle2 = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    );

    const Circle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
    );

    const Bookmark = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
    );

    const Download = () => (
      <svg className="w-3.5 h-3.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    );

    const Upload = () => (
      <svg className="w-3.5 h-3.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    );

    const Trash2 = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    );

    const Filter = () => (
      <svg className="w-4 h-4 text-emerald-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
    );

    function OtterHoltBudgetLab() {
      const [activeTab, setActiveTab] = useState('calendar');
      const [filterOwner, setFilterOwner] = useState('All');
      const [syncStatus, setSyncStatus] = useState('Connecting to Firebase...');

      const [jointExpenses, setJointExpenses] = useState([]);
      const [personalBills, setPersonalBills] = useState([]);
      const [bookmarks, setBookmarks] = useState([]);

      const [newJoint, setNewJoint] = useState({ name: '', amount: '', dueDate: '', category: 'General' });
      const [newPersonal, setNewPersonal] = useState({ owner: 'Matt', name: '', amount: '', dueDate: '', category: 'Personal' });
      const [newBookmark, setNewBookmark] = useState({ name: '', url: '' });

      // Real-time listener across all active user sessions
      useEffect(() => {
        const budgetRef = db.ref('budgetData');
        budgetRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setJointExpenses(data.jointExpenses || []);
            setPersonalBills(data.personalBills || []);
            setBookmarks(data.bookmarks || []);
            setSyncStatus('Live Synced with Firebase');
          } else {
            const initialJoint = [
              { id: 'j-1', name: 'Rent / Mortgage', amount: 2400.00, dueDate: '2026-10-01', category: 'Housing', isPaid: true },
              { id: 'j-2', name: 'Electric & Gas Utility', amount: 145.50, dueDate: '2026-10-15', category: 'Utilities', isPaid: false }
            ];
            const initialPersonal = [
              { id: 'p-1', owner: 'Matt', name: 'Personal Mobile Plan', amount: 65.00, dueDate: '2026-10-08', category: 'Personal Utility', isPaid: false },
              { id: 'p-2', owner: 'Clint', name: 'Car Insurance', amount: 120.00, dueDate: '2026-10-12', category: 'Insurance', isPaid: false }
            ];
            const initialBookmarks = [
              { id: 'bm-1', name: 'Electric Portal', url: 'https://example.com/utility' }
            ];
            budgetRef.set({ jointExpenses: initialJoint, personalBills: initialPersonal, bookmarks: initialBookmarks });
          }
        }, () => {
          setSyncStatus('Sync Error: Check Firebase Rules');
        });

        return () => budgetRef.off();
      }, []);

      const saveToFirebase = (updatedJoint, updatedPersonal, updatedBookmarks) => {
        setSyncStatus('Saving changes...');
        db.ref('budgetData').set({
          jointExpenses: updatedJoint,
          personalBills: updatedPersonal,
          bookmarks: updatedBookmarks
        }).then(() => {
          setSyncStatus('Live Synced with Firebase');
        });
      };

      const handleAddJointExpense = (e) => {
        e.preventDefault();
        if (!newJoint.name || !newJoint.amount || !newJoint.dueDate) return;
        const updated = [...jointExpenses, { ...newJoint, id: `j-${Date.now()}`, amount: parseFloat(newJoint.amount), isPaid: false }];
        saveToFirebase(updated, personalBills, bookmarks);
        setNewJoint({ name: '', amount: '', dueDate: '', category: 'General' });
      };

      const handleAddPersonalBill = (e) => {
        e.preventDefault();
        if (!newPersonal.name || !newPersonal.amount || !newPersonal.dueDate) return;
        const updated = [...personalBills, { ...newPersonal, id: `p-${Date.now()}`, amount: parseFloat(newPersonal.amount), isPaid: false }];
        saveToFirebase(jointExpenses, updated, bookmarks);
        setNewPersonal({ owner: 'Matt', name: '', amount: '', dueDate: '', category: 'Personal' });
      };

      const handleAddBookmark = (e) => {
        e.preventDefault();
        if (!newBookmark.name || !newBookmark.url) return;
        const updated = [...bookmarks, { ...newBookmark, id: `bm-${Date.now()}` }];
        saveToFirebase(jointExpenses, personalBills, updated);
        setNewBookmark({ name: '', url: '' });
      };

      const toggleJointPaid = (id) => {
        const updated = jointExpenses.map(item => item.id === id ? { ...item, isPaid: !item.isPaid } : item);
        saveToFirebase(updated, personalBills, bookmarks);
      };

      const togglePersonalPaid = (id) => {
        const updated = personalBills.map(item => item.id === id ? { ...item, isPaid: !item.isPaid } : item);
        saveToFirebase(jointExpenses, updated, bookmarks);
      };

      const deleteJoint = (id) => {
        const updated = jointExpenses.filter(item => item.id !== id);
        saveToFirebase(updated, personalBills, bookmarks);
      };

      const deletePersonal = (id) => {
        const updated = personalBills.filter(item => item.id !== id);
        saveToFirebase(jointExpenses, updated, bookmarks);
      };

      const deleteBookmark = (id) => {
        const updated = bookmarks.filter(bm => bm.id !== id);
        saveToFirebase(jointExpenses, personalBills, updated);
      };

      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ jointExpenses, personalBills, bookmarks }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `OtterHolt_BudgetLab_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              saveToFirebase(parsed.jointExpenses || [], parsed.personalBills || [], parsed.bookmarks || []);
            } catch (err) {
              alert("Invalid JSON format.");
            }
          };
        }
      };

      const getCalendarDays = () => {
        const year = 2026;
        const month = 9;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const days = [];

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dayJoint = jointExpenses.filter(e => e.dueDate === dateStr);
          const dayPersonal = personalBills.filter(p => {
            if (p.dueDate !== dateStr) return false;
            if (filterOwner !== 'All' && p.owner !== filterOwner) return false;
            return true;
          });

          days.push({ day, dateStr, items: [...dayJoint.map(j => ({ ...j, isPersonal: false })), ...dayPersonal.map(p => ({ ...p, isPersonal: true }))] });
        }
        return days;
      };

      const calendarDays = getCalendarDays();
      const totalJoint = jointExpenses.reduce((sum, item) => sum + item.amount, 0);
      const totalPersonalMatt = personalBills.filter(b => b.owner === 'Matt').reduce((sum, b) => sum + b.amount, 0);
      const totalPersonalClint = personalBills.filter(b => b.owner === 'Clint').reduce((sum, b) => sum + b.amount, 0);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 md:p-8">
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 mb-8 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <h1 className="text-3xl font-extrabold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                  Otter Holt BudgetLab
                </h1>
                <span className="text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-medium">
                  {syncStatus}
                </span>
              </div>
              <p className="text-slate-400 text-sm mt-1">Unified Real-Time Household & Personal Bill Due Date Management</p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm">
                <Filter />
                <span className="text-xs text-slate-400 mr-2">Filter View:</span>
                <select 
                  value={filterOwner} 
                  onChange={(e) => setFilterOwner(e.target.value)}
                  className="bg-transparent text-slate-200 font-medium outline-none cursor-pointer"
                >
                  <option value="All" className="bg-slate-900">All Bills & Expenses</option>
                  <option value="Matt" className="bg-slate-900">Matt's Bills Only</option>
                  <option value="Clint" className="bg-slate-900">Clint's Bills Only</option>
                </select>
              </div>

              <button onClick={handleExportJSON} className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded-lg transition">
                <Download /> Export
              </button>

              <label className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded-lg cursor-pointer transition">
                <Upload /> Import
                <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
              </label>
            </div>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
              <div>
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Joint Expenses</span>
                <p className="text-2xl font-bold text-emerald-400 mt-1">${totalJoint.toFixed(2)}</p>
                <p className="text-xs text-slate-500 mt-1">Split 50/50: ${(totalJoint / 2).toFixed(2)} each</p>
              </div>
              <Users className="w-10 h-10 text-emerald-500/20" />
            </div>

            <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
              <div>
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Matt's Personal Bills</span>
                <p className="text-2xl font-bold text-sky-400 mt-1">${totalPersonalMatt.toFixed(2)}</p>
                <p className="text-xs text-slate-500 mt-1">Individual ledger items</p>
              </div>
              <User className="w-10 h-10 text-sky-500/20" />
            </div>

            <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
              <div>
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Clint's Personal Bills</span>
                <p className="text-2xl font-bold text-purple-400 mt-1">${totalPersonalClint.toFixed(2)}</p>
                <p className="text-xs text-slate-500 mt-1">Individual ledger items</p>
              </div>
              <User className="w-10 h-10 text-purple-500/20" />
            </div>
          </div>

          <div className="flex border-b border-slate-800 mb-6 gap-6">
            <button 
              onClick={() => setActiveTab('calendar')}
              className={`pb-3 flex items-center gap-2 text-sm font-semibold border-b-2 transition ${activeTab === 'calendar' ? 'border-emerald-400 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
            >
              <CalendarIcon /> Due Date Calendar
            </button>
            <button 
              onClick={() => setActiveTab('ledgers')}
              className={`pb-3 flex items-center gap-2 text-sm font-semibold border-b-2 transition ${activeTab === 'ledgers' ? 'border-emerald-400 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
            >
              <DollarSign /> Expense & Bill Ledgers
            </button>
            <button 
              onClick={() => setActiveTab('bookmarks')}
              className={`pb-3 flex items-center gap-2 text-sm font-semibold border-b-2 transition ${activeTab === 'bookmarks' ? 'border-emerald-400 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
            >
              <Bookmark /> Portals & Bookmarks
            </button>
          </div>

          {activeTab === 'calendar' && (
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
              <div className="flex items-center justify-between mb-6">
                <h2 className="text-lg font-bold text-slate-100">October 2026 Due Dates</h2>
                <div className="flex items-center gap-4 text-xs">
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Joint Expense</span>
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-sky-500 inline-block"></span> Matt's Personal Bill</span>
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-purple-500 inline-block"></span> Clint's Personal Bill</span>
                </div>
              </div>

              <div className="grid grid-cols-7 gap-2">
                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                  <div key={d} className="text-center text-xs font-bold text-slate-500 py-2 uppercase">{d}</div>
                ))}

                {calendarDays.map((cell) => (
                  <div key={cell.dateStr} className="min-h-[100px] bg-slate-950/60 border border-slate-800/80 rounded-lg p-2 flex flex-col justify-between">
                    <span className="text-xs font-semibold text-slate-400">{cell.day}</span>
                    <div className="space-y-1 my-1">
                      {cell.items.map(item => {
                        const badgeBg = !item.isPersonal 
                          ? 'bg-emerald-950/80 border-emerald-800/60 text-emerald-300' 
                          : item.owner === 'Matt'
                          ? 'bg-sky-950/80 border-sky-800/60 text-sky-300'
                          : 'bg-purple-950/80 border-purple-800/60 text-purple-300';

                        return (
                          <div 
                            key={item.id} 
                            className={`text-[10px] p-1.5 rounded border ${badgeBg} ${item.isPaid ? 'opacity-40 line-through' : ''}`}
                            title={`${item.name} - $${item.amount}`}
                          >
                            <div className="font-semibold truncate">{item.name}</div>
                            <div className="font-mono">${item.amount.toFixed(2)}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === 'ledgers' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <h2 className="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                    <Users className="w-5 h-5 text-emerald-400" /> Joint Household Expenses
                  </h2>

                  <form onSubmit={handleAddJointExpense} className="grid grid-cols-2 gap-3 mb-6 bg-slate-950 p-4 rounded-lg border border-slate-800/60">
                    <input 
                      type="text" 
                      placeholder="Expense Name" 
                      value={newJoint.name} 
                      onChange={(e) => setNewJoint({...newJoint, name: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200" 
                    />
                    <input 
                      type="number" 
                      step="0.01" 
                      placeholder="Amount ($)" 
                      value={newJoint.amount} 
                      onChange={(e) => setNewJoint({...newJoint, amount: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200" 
                    />
                    <input 
                      type="date" 
                      value={newJoint.dueDate} 
                      onChange={(e) => setNewJoint({...newJoint, dueDate: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200" 
                    />
                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold py-2 rounded transition flex items-center justify-center gap-1">
                      <PlusCircle className="w-3.5 h-3.5" /> Add Joint Expense
                    </button>
                  </form>

                  <div className="space-y-2">
                    {jointExpenses.map(item => (
                      <div key={item.id} className="flex items-center justify-between p-3 bg-slate-950/80 rounded-lg border border-slate-800">
                        <div className="flex items-center gap-3">
                          <button onClick={() => toggleJointPaid(item.id)} className="text-slate-400 hover:text-emerald-400">
                            {item.isPaid ? <CheckCircle2 className="w-5 h-5 text-emerald-400" /> : <Circle className="w-5 h-5" />}
                          </button>
                          <div>
                            <p className={`text-sm font-semibold ${item.isPaid ? 'line-through text-slate-500' : 'text-slate-200'}`}>{item.name}</p>
                            <p className="text-xs text-slate-500">Due: {item.dueDate}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-mono text-sm font-bold text-slate-200">${item.amount.toFixed(2)}</span>
                          <button onClick={() => deleteJoint(item.id)} className="text-slate-500 hover:text-rose-400">
                            <Trash2 />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <h2 className="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                    <User className="w-5 h-5 text-sky-400" /> Personal Bills & Subscriptions
                  </h2>

                  <form onSubmit={handleAddPersonalBill} className="grid grid-cols-2 gap-3 mb-6 bg-slate-950 p-4 rounded-lg border border-slate-800/60">
                    <select 
                      value={newPersonal.owner} 
                      onChange={(e) => setNewPersonal({...newPersonal, owner: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200"
                    >
                      <option value="Matt">Matt</option>
                      <option value="Clint">Clint</option>
                    </select>
                    <input 
                      type="text" 
                      placeholder="Bill Name" 
                      value={newPersonal.name} 
                      onChange={(e) => setNewPersonal({...newPersonal, name: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200" 
                    />
                    <input 
                      type="number" 
                      step="0.01" 
                      placeholder="Amount ($)" 
                      value={newPersonal.amount} 
                      onChange={(e) => setNewPersonal({...newPersonal, amount: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200" 
                    />
                    <input 
                      type="date" 
                      value={newPersonal.dueDate} 
                      onChange={(e) => setNewPersonal({...newPersonal, dueDate: e.target.value})}
                      className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200" 
                    />
                    <button type="submit" className="col-span-2 bg-sky-600 hover:bg-sky-500 text-xs font-semibold py-2 rounded transition flex items-center justify-center gap-1">
                      <PlusCircle className="w-3.5 h-3.5" /> Add Personal Bill Due Date
                    </button>
                  </form>

                  <div className="space-y-2">
                    {personalBills
                      .filter(b => filterOwner === 'All' || b.owner === filterOwner)
                      .map(item => (
                        <div key={item.id} className="flex items-center justify-between p-3 bg-slate-950/80 rounded-lg border border-slate-800">
                          <div className="flex items-center gap-3">
                            <button onClick={() => togglePersonalPaid(item.id)} className="text-slate-400 hover:text-sky-400">
                              {item.isPaid ? <CheckCircle2 className="w-5 h-5 text-sky-400" /> : <Circle className="w-5 h-5" />}
                            </button>
                            <div>
                              <div className="flex items-center gap-2">
                                <p className={`text-sm font-semibold ${item.isPaid ? 'line-through text-slate-500' : 'text-slate-200'}`}>{item.name}</p>
                                <span className={`text-[10px] px-1.5 py-0.5 rounded ${item.owner === 'Matt' ? 'bg-sky-950 text-sky-300 border border-sky-800' : 'bg-purple-950 text-purple-300 border border-purple-800'}`}>
                                  {item.owner}
                                </span>
                              </div>
                              <p className="text-xs text-slate-500">Due: {item.dueDate}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="font-mono text-sm font-bold text-slate-200">${item.amount.toFixed(2)}</span>
                            <button onClick={() => deletePersonal(item.id)} className="text-slate-500 hover:text-rose-400">
                              <Trash2 />
                            </button>
                          </div>
                        </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'bookmarks' && (
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
              <h2 className="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                <Bookmark /> Service Portal Bookmarks
              </h2>

              <form onSubmit={handleAddBookmark} className="flex gap-3 mb-6 bg-slate-950 p-4 rounded-lg border border-slate-800/60">
                <input 
                  type="text" 
                  placeholder="Portal Name" 
                  value={newBookmark.name} 
                  onChange={(e) => setNewBookmark({...newBookmark, name: e.target.value})}
                  className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200 flex-1" 
                />
                <input 
                  type="url" 
                  placeholder="https://..." 
                  value={newBookmark.url} 
                  onChange={(e) => setNewBookmark({...newBookmark, url: e.target.value})}
                  className="bg-slate-900 border border-slate-800 rounded p-2 text-xs text-slate-200 flex-1" 
                />
                <button type="submit" className="bg-teal-600 hover:bg-teal-500 text-xs font-semibold px-4 py-2 rounded transition flex items-center gap-1">
                  <PlusCircle className="w-3.5 h-3.5" /> Save Bookmark
                </button>
              </form>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {bookmarks.map(bm => (
                  <div key={bm.id} className="flex items-center justify-between p-3 bg-slate-950 rounded-lg border border-slate-800">
                    <a href={bm.url} target="_blank" rel="noopener noreferrer" className="text-sm font-medium text-teal-400 hover:underline truncate mr-2">
                      {bm.name}
                    </a>
                    <button onClick={() => deleteBookmark(bm.id)} className="text-slate-500 hover:text-rose-400">
                      <Trash2 />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OtterHoltBudgetLab />);
  </script>
</body>
</html>
